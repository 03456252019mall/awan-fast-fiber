name: Auto Update From Zip

on:
  push:
    paths:
      - "*.zip"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract zip and replace project files
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "No zip file found, skipping."
            exit 0
          fi
          rm -rf _tmp_extract
          mkdir _tmp_extract
          unzip -q "$ZIP_FILE" -d _tmp_extract
          SRC_DIR=$(find _tmp_extract -maxdepth 1 -mindepth 1 -type d | head -n 1)
          if [ -z "$SRC_DIR" ]; then
            SRC_DIR="_tmp_extract"
          fi
          find . -maxdepth 1 -mindepth 1 ! -name ".git" ! -name ".github" ! -name "*.zip" ! -name "_tmp_extract" -exec rm -rf {} +
          cp -r "$SRC_DIR"/. .
          rm -rf _tmp_extract "$ZIP_FILE"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Auto-update from uploaded zip"
          git push
